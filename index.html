<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Prep Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JSONbin.io for cloud sync -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fafafa; font-family: 'Inter', sans-serif; }
    .serif { font-family: 'Libre Baskerville', serif; }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback } = React;

    // ============== JSONBIN.IO CLOUD SYNC ==============
    // Uses JSONbin.io for simple JSON cloud storage

    // Sync data keys
    const SYNC_KEYS = [
      'mealprep-custom-recipes',
      'mealprep-meal-plan',
      'mealprep-targets',
      'mealprep-food-log',
      'mealprep-pantry-needs',
      'mealprep-breakfast',
      'mealprep-custom-pantry',
      'mealprep-hidden-pantry',
      'mealprep-beverage-needs',
      'mealprep-snack-needs',
      'mealprep-pantry-categories',
      'mealprep-recipe-images'
    ];

    // ============== RECIPE DATABASE - LOADED DYNAMICALLY ==============
    // Default recipes are loaded on first launch, then cached in localStorage
    // Try local file first, then GitHub as fallback
    const LOCAL_RECIPES_URL = './meal-prep-recipes.json';
    const GITHUB_RECIPES_URL = 'https://raw.githubusercontent.com/drsyedalihaider/meal-prep-pro/main/meal-prep-recipes.json';

    // Placeholder arrays - will be populated when MealPrepPro loads
    var RECIPES = [];
    var DEFAULT_BEVERAGES = [];
    var DEFAULT_BREAKFAST = [];
    var DEFAULT_SNACKS = [];

    const DEFAULT_TARGETS = { protein: 190, calories: 2900, carbs: 350, fat: 85 };
    const PROTEIN_PER_MEAL = 63;

    // ============== DATA LOADER WRAPPER ==============
    function DataLoader(props) {
      var [loading, setLoading] = React.useState(true);
      var [error, setError] = React.useState(null);
      var [data, setData] = React.useState(null);

      React.useEffect(function() {
        loadRecipes();
      }, []);

      function loadRecipes() {
        // Check localStorage first
        var cached = localStorage.getItem('mealprep-default-recipes');
        if (cached) {
          try {
            var parsed = JSON.parse(cached);
            applyData(parsed);
            setData(parsed);
            setLoading(false);
            return;
          } catch (e) {
            console.error('Failed to parse cached recipes:', e);
          }
        }

        // Try loading from JSONbin if configured
        var jsonbinKey = localStorage.getItem('mealprep-jsonbin-key');
        var jsonbinId = localStorage.getItem('mealprep-jsonbin-id');

        if (jsonbinKey && jsonbinId) {
          fetch('https://api.jsonbin.io/v3/b/' + jsonbinId + '/latest', {
            method: 'GET',
            headers: { 'X-Master-Key': jsonbinKey }
          })
          .then(function(res) { return res.json(); })
          .then(function(result) {
            if (result.record && result.record.defaultRecipes) {
              var recipesData = result.record.defaultRecipes;
              localStorage.setItem('mealprep-default-recipes', JSON.stringify(recipesData));
              applyData(recipesData);
              setData(recipesData);
              setLoading(false);
            } else {
              loadFromGithub(jsonbinKey, jsonbinId);
            }
          })
          .catch(function(err) {
            console.error('JSONbin load failed:', err);
            loadFromGithub(jsonbinKey, jsonbinId);
          });
        } else {
          loadFromGithub(null, null);
        }
      }

      function loadFromGithub(jsonbinKey, jsonbinId) {
        // Try local file first
        fetch(LOCAL_RECIPES_URL)
          .then(function(res) {
            if (!res.ok) throw new Error('Local file not found');
            return res.json();
          })
          .then(function(recipesData) {
            handleRecipesLoaded(recipesData, jsonbinKey, jsonbinId);
          })
          .catch(function(localErr) {
            console.log('Local recipes not found, trying GitHub...');
            // Fallback to GitHub
            fetch(GITHUB_RECIPES_URL)
              .then(function(res) {
                if (!res.ok) throw new Error('GitHub file not found');
                return res.json();
              })
              .then(function(recipesData) {
                handleRecipesLoaded(recipesData, jsonbinKey, jsonbinId);
              })
              .catch(function(err) {
                console.error('Failed to load recipes:', err);
                setError('Failed to load recipes. Please make sure meal-prep-recipes.json is in the same folder as index.html, or check your internet connection.');
                setLoading(false);
              });
          });
      }

      function handleRecipesLoaded(recipesData, jsonbinKey, jsonbinId) {
        localStorage.setItem('mealprep-default-recipes', JSON.stringify(recipesData));
        applyData(recipesData);
        setData(recipesData);
        setLoading(false);

        // Upload to JSONbin if configured
        if (jsonbinKey && jsonbinId) {
          uploadToJsonbin(jsonbinKey, jsonbinId, recipesData);
        }
      }

      function uploadToJsonbin(key, binId, recipesData) {
        fetch('https://api.jsonbin.io/v3/b/' + binId + '/latest', {
          method: 'GET',
          headers: { 'X-Master-Key': key }
        })
        .then(function(res) { return res.json(); })
        .then(function(existing) {
          var newData = existing.record || {};
          newData.defaultRecipes = recipesData;
          return fetch('https://api.jsonbin.io/v3/b/' + binId, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': key
            },
            body: JSON.stringify(newData)
          });
        })
        .catch(function(err) {
          console.error('Failed to upload to JSONbin:', err);
        });
      }

      function applyData(recipesData) {
        RECIPES = recipesData.recipes || [];
        DEFAULT_BEVERAGES = recipesData.beverages || [];
        DEFAULT_BREAKFAST = recipesData.breakfast || [];
        DEFAULT_SNACKS = recipesData.snacks || [];
      }

      if (loading) {
        return (
          <div className="fixed inset-0 bg-gradient-to-br from-gray-900 to-gray-800 flex items-center justify-center z-50">
            <div className="text-center p-8">
              <div className="w-20 h-20 bg-white/10 rounded-2xl flex items-center justify-center mx-auto mb-6 animate-pulse">
                <span className="text-4xl">🍽️</span>
              </div>
              <h1 className="text-2xl font-bold text-white mb-2">Meal Prep Pro</h1>
              <p className="text-gray-400 mb-4">Loading recipes...</p>
              <div className="w-48 h-1 bg-white/20 rounded-full mx-auto overflow-hidden">
                <div className="h-full bg-white/60 rounded-full animate-[loading_1s_ease-in-out_infinite]" style={{width: '60%'}}></div>
              </div>
            </div>
          </div>
        );
      }

      if (error) {
        return (
          <div className="fixed inset-0 bg-gradient-to-br from-gray-900 to-gray-800 flex items-center justify-center z-50">
            <div className="text-center p-8 max-w-md">
              <div className="w-20 h-20 bg-red-500/20 rounded-2xl flex items-center justify-center mx-auto mb-6">
                <span className="text-4xl">⚠️</span>
              </div>
              <h1 className="text-2xl font-bold text-white mb-2">Loading Error</h1>
              <p className="text-gray-400 mb-6">{error}</p>
              <button
                onClick={function() { window.location.reload(); }}
                className="px-6 py-3 bg-white text-gray-900 rounded-xl font-medium hover:bg-gray-100"
              >
                Refresh Page
              </button>
            </div>
          </div>
        );
      }

      return <MealPrepPro />;
    }

    function PinLockScreen(props) {
      var onUnlock = props.onUnlock;
      var storedPin = props.storedPin;

      var [pin, setPin] = useState('');
      var [error, setError] = useState('');

      function handlePinInput(digit) {
        var newPin = pin + digit;
        setPin(newPin);
        setError('');
        if (newPin.length === storedPin.length) {
          if (newPin === storedPin) {
            onUnlock();
          } else {
            setError('Incorrect PIN');
            setPin('');
          }
        }
      }

      function handleDelete() {
        setPin(pin.slice(0, -1));
        setError('');
      }

      return (
        <div className="fixed inset-0 bg-gradient-to-br from-gray-900 to-gray-800 flex items-center justify-center z-50">
          <div className="text-center p-8">
            <div className="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center mx-auto mb-6">
              <span className="text-3xl">🍽️</span>
            </div>
            <h1 className="text-2xl font-bold text-white mb-2">Meal Prep Pro</h1>
            <p className="text-gray-400 mb-8">Enter PIN to continue</p>

            {/* PIN Dots */}
            <div className="flex justify-center gap-3 mb-6">
              {Array.from({ length: storedPin.length }).map(function(_, i) {
                return (
                  <div
                    key={i}
                    className={"w-4 h-4 rounded-full transition-all " + (i < pin.length ? 'bg-white scale-110' : 'bg-white/20')}
                  />
                );
              })}
            </div>

            {error && <p className="text-red-400 text-sm mb-4">{error}</p>}

            {/* Number Pad */}
            <div className="grid grid-cols-3 gap-4 max-w-xs mx-auto">
              {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(function(num) {
                return (
                  <button
                    key={num}
                    onClick={function() { handlePinInput(num.toString()); }}
                    className="w-16 h-16 rounded-full bg-white/10 text-white text-2xl font-medium hover:bg-white/20 active:scale-95 transition-all"
                  >
                    {num}
                  </button>
                );
              })}
              <div></div>
              <button
                onClick={function() { handlePinInput('0'); }}
                className="w-16 h-16 rounded-full bg-white/10 text-white text-2xl font-medium hover:bg-white/20 active:scale-95 transition-all"
              >
                0
              </button>
              <button
                onClick={handleDelete}
                className="w-16 h-16 rounded-full bg-white/5 text-white/60 text-xl hover:bg-white/10 active:scale-95 transition-all flex items-center justify-center"
              >
                ⌫
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============== SETTINGS MODAL ==============
    const AVAILABLE_MODELS = [
      { id: 'claude-3-haiku-20240307', name: 'Claude 3 Haiku', description: 'Fastest & cheapest', cost: '$0.25/M tokens' },
      { id: 'claude-3-5-haiku-20241022', name: 'Claude 3.5 Haiku', description: 'Fast & affordable', cost: '$1/M tokens' },
      { id: 'claude-sonnet-4-20250514', name: 'Claude Sonnet 4', description: 'Balanced', cost: '$3/M tokens' },
      { id: 'claude-3-5-sonnet-20241022', name: 'Claude 3.5 Sonnet', description: 'High quality', cost: '$3/M tokens' }
    ];

    function SettingsModal(props) {
      var isOpen = props.isOpen;
      var onClose = props.onClose;
      var apiKey = props.apiKey;
      var setApiKey = props.setApiKey;
      var tempKey = props.tempKey;
      var setTempKey = props.setTempKey;
      var openaiKey = props.openaiKey;
      var setOpenaiKey = props.setOpenaiKey;
      var tempOpenaiKey = props.tempOpenaiKey;
      var setTempOpenaiKey = props.setTempOpenaiKey;
      var selectedModel = props.selectedModel;
      var setSelectedModel = props.setSelectedModel;
      var syncStatus = props.syncStatus;
      var onSync = props.onSync;
      var onPullFromCloud = props.onPullFromCloud;

      var [jsonbinKey, setJsonbinKey] = useState(localStorage.getItem('mealprep-jsonbin-key') || '');
      var [jsonbinId, setJsonbinId] = useState(localStorage.getItem('mealprep-jsonbin-id') || '');
      var [settingsTab, setSettingsTab] = useState('api');
      var [creatingBin, setCreatingBin] = useState(false);

      if (!isOpen) return null;

      function handleSave() {
        setApiKey(tempKey);
        setOpenaiKey(tempOpenaiKey);
        onClose();
      }

      function handleSaveJsonbin() {
        localStorage.setItem('mealprep-jsonbin-key', jsonbinKey);
        localStorage.setItem('mealprep-jsonbin-id', jsonbinId);
        alert('JSONbin settings saved!');
        window.location.reload();
      }

      function createNewBin() {
        if (!jsonbinKey) {
          alert('Please enter your API key first');
          return;
        }
        setCreatingBin(true);
        fetch('https://api.jsonbin.io/v3/b', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': jsonbinKey,
            'X-Bin-Name': 'meal-prep-pro-data'
          },
          body: JSON.stringify({ created: new Date().toISOString(), data: {} })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          setCreatingBin(false);
          if (data.metadata && data.metadata.id) {
            setJsonbinId(data.metadata.id);
            alert('Bin created! ID: ' + data.metadata.id);
          } else {
            alert('Error: ' + (data.message || 'Could not create bin'));
          }
        })
        .catch(function(err) {
          setCreatingBin(false);
          alert('Error creating bin: ' + err.message);
        });
      }

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={onClose}>
          <div className="bg-white rounded-2xl p-6 w-full max-w-lg shadow-2xl max-h-[90vh] overflow-y-auto" onClick={function(e) { e.stopPropagation(); }}>
            <h2 className="text-xl font-bold text-gray-900 serif mb-4">Settings</h2>

            {/* Settings Tabs */}
            <div className="flex gap-1 bg-gray-100 p-1 rounded-lg mb-4">
              <button
                onClick={function() { setSettingsTab('api'); }}
                className={settingsTab === 'api' ? "flex-1 px-3 py-2 rounded-md text-sm font-medium bg-white shadow-sm" : "flex-1 px-3 py-2 rounded-md text-sm font-medium text-gray-600 hover:text-gray-900"}
              >
                🤖 AI
              </button>
              <button
                onClick={function() { setSettingsTab('sync'); }}
                className={settingsTab === 'sync' ? "flex-1 px-3 py-2 rounded-md text-sm font-medium bg-white shadow-sm" : "flex-1 px-3 py-2 rounded-md text-sm font-medium text-gray-600 hover:text-gray-900"}
              >
                ☁️ Cloud Sync
              </button>
              <button
                onClick={function() { setSettingsTab('backup'); }}
                className={settingsTab === 'backup' ? "flex-1 px-3 py-2 rounded-md text-sm font-medium bg-white shadow-sm" : "flex-1 px-3 py-2 rounded-md text-sm font-medium text-gray-600 hover:text-gray-900"}
              >
                💾 Backup
              </button>
            </div>

            <div className="space-y-4">
              {/* API Tab */}
              {settingsTab === 'api' && (
                <>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">Claude API Key</label>
                    <input
                      type="password"
                      value={tempKey}
                      onChange={function(e) { setTempKey(e.target.value); }}
                      placeholder="Enter your Claude API key (sk-ant-...)"
                      className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent"
                    />
                    <p className="text-xs text-gray-500 mt-2">
                      Get your API key from <a href="https://console.anthropic.com/settings/keys" target="_blank" className="text-blue-600 hover:underline">Anthropic Console</a>
                    </p>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">OpenAI API Key (for Recipe Images)</label>
                    <input
                      type="password"
                      value={tempOpenaiKey}
                      onChange={function(e) { setTempOpenaiKey(e.target.value); }}
                      placeholder="Enter your OpenAI API key (sk-...)"
                      className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent"
                    />
                    <p className="text-xs text-gray-500 mt-2">
                      Optional - for AI-generated recipe images. Get key from <a href="https://platform.openai.com/api-keys" target="_blank" className="text-blue-600 hover:underline">OpenAI Platform</a>
                    </p>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">AI Model</label>
                    <div className="space-y-2">
                      {AVAILABLE_MODELS.map(function(model) {
                        return (
                          <button
                            key={model.id}
                            onClick={function() { setSelectedModel(model.id); }}
                            className={"w-full p-3 rounded-xl border-2 text-left transition-all " + (selectedModel === model.id ? "border-gray-900 bg-gray-50" : "border-gray-200 hover:border-gray-300")}
                          >
                            <div className="flex items-center justify-between">
                              <div>
                                <span className="font-medium text-gray-900">{model.name}</span>
                                <span className="text-gray-500 text-sm ml-2">{model.description}</span>
                              </div>
                              <span className="text-xs text-gray-400">{model.cost}</span>
                            </div>
                          </button>
                        );
                      })}
                    </div>
                    <p className="text-xs text-gray-500 mt-2">
                      Haiku is recommended for recipe parsing - fast and cost-effective.
                    </p>
                  </div>
                </>
              )}

              {/* Cloud Sync Tab */}
              {settingsTab === 'sync' && (
                <>
                  <div className="bg-gradient-to-r from-purple-50 to-blue-50 border border-purple-200 rounded-xl p-4">
                    <h3 className="font-medium text-gray-900 flex items-center gap-2">
                      <span className="text-xl">☁️</span> Cloud Sync with JSONbin.io
                    </h3>
                    <p className="text-sm text-gray-600 mt-1">
                      Sync your data across all devices. Free tier: 10,000 requests/month.
                    </p>
                  </div>

                  {/* Sync Status */}
                  <div className="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                    <div className="flex items-center gap-2">
                      <div className={"w-3 h-3 rounded-full " + (syncStatus === 'connected' ? 'bg-green-500' : syncStatus === 'syncing' ? 'bg-yellow-500 animate-pulse' : 'bg-gray-400')}></div>
                      <span className="text-sm font-medium text-gray-700">
                        {syncStatus === 'connected' ? 'Connected' : syncStatus === 'syncing' ? 'Syncing...' : 'Not connected'}
                      </span>
                    </div>
                    {syncStatus === 'connected' && (
                      <div className="flex gap-2">
                        <button
                          onClick={onPullFromCloud}
                          className="px-3 py-1.5 bg-blue-100 text-blue-700 rounded-lg text-xs font-medium hover:bg-blue-200"
                        >
                          ↓ Pull
                        </button>
                        <button
                          onClick={onSync}
                          className="px-3 py-1.5 bg-green-100 text-green-700 rounded-lg text-xs font-medium hover:bg-green-200"
                        >
                          ↑ Push
                        </button>
                      </div>
                    )}
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">JSONbin API Key</label>
                    <input
                      type="password"
                      value={jsonbinKey}
                      onChange={function(e) { setJsonbinKey(e.target.value); }}
                      placeholder="$2a$10$xxxxx..."
                      className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500"
                    />
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">Bin ID</label>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        value={jsonbinId}
                        onChange={function(e) { setJsonbinId(e.target.value); }}
                        placeholder="xxxxxxxxxxxxxxxxxxxxxxxx"
                        className="flex-1 px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 font-mono"
                      />
                      <button
                        onClick={createNewBin}
                        disabled={creatingBin || !jsonbinKey}
                        className="px-4 py-3 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 text-sm font-medium disabled:opacity-50"
                      >
                        {creatingBin ? 'Creating...' : 'Create New'}
                      </button>
                    </div>
                    <p className="text-xs text-gray-500 mt-2">
                      Use the same Bin ID on all devices to sync. Create a new bin or paste existing ID.
                    </p>
                  </div>

                  <button
                    onClick={handleSaveJsonbin}
                    className="w-full px-4 py-3 bg-purple-600 text-white rounded-xl hover:bg-purple-700 font-medium"
                  >
                    Save & Connect
                  </button>

                  <div className="bg-gray-50 rounded-xl p-4 text-sm">
                    <p className="font-medium text-gray-900 mb-2">📝 Quick Setup (2 mins):</p>
                    <ol className="list-decimal list-inside space-y-1 text-gray-600">
                      <li>Go to <a href="https://jsonbin.io" target="_blank" className="text-purple-600 hover:underline">jsonbin.io</a> and sign up free</li>
                      <li>Click your profile → API Keys</li>
                      <li>Copy your "X-Master-Key" and paste above</li>
                      <li>Click "Create New" to make a bin, or paste an existing Bin ID</li>
                      <li>Click "Save & Connect"</li>
                    </ol>
                  </div>
                </>
              )}

              {/* Backup Tab */}
              {settingsTab === 'backup' && (
                <>
                  <div className="bg-amber-50 border border-amber-200 rounded-xl p-4">
                    <h3 className="font-medium text-gray-900 flex items-center gap-2">
                      <span className="text-xl">💾</span> Local Backup
                    </h3>
                    <p className="text-sm text-gray-600 mt-1">
                      Export your data to a JSON file for manual backup or transfer.
                    </p>
                  </div>

                  <div className="flex gap-2">
                    <button
                      onClick={function() {
                        var data = {};
                        var keys = ['mealprep-claude-key', 'mealprep-ai-model', 'mealprep-custom-recipes', 'mealprep-meal-plan', 'mealprep-targets', 'mealprep-food-log', 'mealprep-pantry-needs', 'mealprep-breakfast', 'mealprep-custom-pantry', 'mealprep-hidden-pantry', 'mealprep-beverage-needs', 'mealprep-snack-needs'];
                        keys.forEach(function(key) {
                          var val = localStorage.getItem(key);
                          if (val) data[key] = JSON.parse(val);
                        });
                        data._exportDate = new Date().toISOString();
                        data._version = '1.0';
                        var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                        var url = URL.createObjectURL(blob);
                        var a = document.createElement('a');
                        a.href = url;
                        a.download = 'meal-prep-backup-' + new Date().toISOString().split('T')[0] + '.json';
                        a.click();
                        URL.revokeObjectURL(url);
                      }}
                      className="flex-1 px-4 py-3 bg-green-600 text-white rounded-xl hover:bg-green-700 flex items-center justify-center gap-2 font-medium"
                    >
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                      Export JSON
                    </button>
                    <label className="flex-1 px-4 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 flex items-center justify-center gap-2 cursor-pointer font-medium">

      var [error, setError] = useState('');

      if (!isOpen) return null;

      function parseRecipe() {
        if (!apiKey) {
          setError('Please add your Claude API key in Settings first.');
          return;
        }
        if (!recipeText.trim()) {
          setError('Please paste a recipe to parse.');
          return;
        }

        setLoading(true);
        setError('');

        var systemPrompt = 'You are a recipe parser. Parse recipes and return ONLY valid JSON with this exact structure: {"name": "Recipe Name", "category": "chicken/beef/seafood/vegetarian", "servings": 6, "proteinPerServing": 50, "caloriesPerServing": 400, "carbsPerServing": 20, "fatPerServing": 18, "description": "Brief description", "cookTime": "45 min", "ingredients": [{"item": "Ingredient name", "amount": 1, "unit": "kg/cups/pcs/tbsp/tsp/g", "store": "walmart/apna"}], "method": ["Step 1", "Step 2"], "mealPrepNote": "Meal prep tips"}. For store, use "apna" for South Asian ingredients (spices, halal meat, daal, ghee, masalas) and "walmart" for common items. Return ONLY the JSON object, no markdown, no explanation.';

        fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'

          body: JSON.stringify({
            model: 'claude-3-haiku-20240307',
            max_tokens: 2048,
            system: systemPrompt,
            messages: [{ role: 'user', content: 'Parse this recipe:\n\n' + recipeText }]
          })

        .then(function(res) { return res.json(); })

          setLoading(false);

            var text = data.content[0].text;
            // Extract JSON from the response
            var jsonMatch = text.match(/\{[\s\S]*\}/);
            if (jsonMatch) {
              try {
                var parsed = JSON.parse(jsonMatch[0]);
                parsed.id = 'custom-' + Date.now();
                parsed.image = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&h=400&fit=crop';
                setParsedRecipe(parsed);
                setStep('preview');

                setError('Failed to parse recipe. Please try again.');

              setError('Failed to parse recipe. Please try again.');
            }

            setError('API error: ' + (data.error.message || 'Check your API key and try again.'));

            setError('API error. Check your API key and try again.');
          }
        })

          setError('Failed to connect to API. Please try again.');

        setParsedRecipe(null);
        setError('');
        onClose();

      function updateField(field, value) {
        setParsedRecipe(function(prev) {
          var updated = Object.assign({}, prev);
          updated[field] = value;
          return updated;
        });

      function updateIngredient(index, field, value) {
        setParsedRecipe(function(prev) {
          var updated = Object.assign({}, prev);

            if (i === index) {
              var newIng = Object.assign({}, ing);

                    />
                  </div>
                  {error && <p className="text-red-500 text-sm">{error}</p>}
                </div>
              )}

              {step === 'preview' && parsedRecipe && (
                <div className="space-y-4">
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Name</label>
                      <input
                        type="text"
                        value={parsedRecipe.name}
                        onChange={function(e) { updateField('name', e.target.value); }}
                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Cook Time</label>
                      <input
                        type="text"
                        value={parsedRecipe.cookTime}
                        onChange={function(e) { updateField('cookTime', e.target.value); }}
                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-gray-500 mb-1">Description</label>
                    <input
                      type="text"
                      value={parsedRecipe.description}

                  <div className="grid grid-cols-5 gap-3">
                    <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Servings</label>
                      <input
                        type="number"

                    </div>
                    <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Calories</label>
                      <input
                        type="number"

                        onChange={function(e) { updateField('caloriesPerServing', parseInt(e.target.value)); }}
                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Carbs</label>

                        return (
                          <div key={i} className="flex gap-2 items-center">
                            <input
                              type="text"
                              value={ing.item}
                              onChange={function(e) { updateIngredient(i, 'item', e.target.value); }}
                              className="flex-1 px-2 py-1.5 text-sm border border-gray-300 rounded-lg"
                            />
                            <input

            <div className="p-6 border-t border-gray-200 flex gap-3">
              {step === 'input' ? (
                <button

                  className="flex-1 px-4 py-3 bg-gray-900 text-white rounded-xl hover:bg-gray-800 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"

                  {loading ? (

            var jsonMatch = text.match(/\{[\s\S]*\}/);
            if (jsonMatch) {
              try {
                var parsed = JSON.parse(jsonMatch[0]);
                // Keep the existing ID if editing, otherwise create new
                parsed.id = recipe.id || ('custom-' + Date.now());
                parsed.image = recipe.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&h=400&fit=crop';
                setRecipe(parsed);
                setMode('form');
                setAiText('');
              } catch (e) {
                setError('Failed to parse AI response. Try again or enter manually.');
              }
            } else {
              setError('AI could not parse the recipe. Try again or enter manually.');
            }
          } else if (data.error) {
            setError('API error: ' + (data.error.message || 'Check your API key and try again.'));
          } else {
            setError('API error. Check your API key and try again.');
          }
        })
        .catch(function(err) {
          setAiLoading(false);
          setError('Failed to connect to AI: ' + err.message);
        });
      }

      function handleSave() {
        if (!recipe.name.trim()) {
          setError('Please enter a recipe name.');
          return;
        }
        onSave(recipe);
        onClose();
      }

      function handleDelete() {
        if (confirm('Delete "' + recipe.name + '"? This cannot be undone.')) {
          onDelete(recipe.id);
          onClose();
        }
      }

      function handleClose() {
        setError('');
        setMode('form');
        setAiText('');
        onClose();
      }

      function handleImageUpload(e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;

        // Check file size (max 2MB)
        if (file.size > 2 * 1024 * 1024) {
          setError('Image too large. Please use an image under 2MB.');
          return;
        }

        var reader = new FileReader();
        reader.onload = function(event) {
          updateField('image', event.target.result);
        };
        reader.readAsDataURL(file);
      }

      function generateImageWithDallE() {
        if (!openaiKey) {
          setError('Please add your OpenAI API key in Settings first.');
          return;
        }
        if (!recipe.name.trim()) {
          setError('Please enter a recipe name first.');
          return;
        }

        setGeneratingImage(true);
        setError('');

        var prompt = 'Professional food photography of ' + recipe.name + ', beautifully plated on a ceramic dish, warm lighting, top-down view, appetizing and delicious looking, high quality professional restaurant presentation';

        fetch('https://api.openai.com/v1/images/generations', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + openaiKey
          },
          body: JSON.stringify({
            model: 'dall-e-3',
            prompt: prompt,
            n: 1,
            size: '1024x1024',
            quality: 'standard'
          })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          setGeneratingImage(false);
          if (data.data && data.data[0] && data.data[0].url) {
            updateField('image', data.data[0].url);
          } else if (data.error) {
            setError('DALL-E error: ' + (data.error.message || 'Try again.'));
          }
        })
        .catch(function(err) {
          setGeneratingImage(false);
          setError('Failed to generate image: ' + err.message);
        });
      }

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={handleClose}>

                </button>
              </div>
              {/* Mode toggle */}
              <div className="flex gap-2 mt-4">
                <button

                >

                <button

                >

                  {/* Basic Info */}
                  <div className="grid grid-cols-2 gap-4">

                          >
                            {generatingImage ? (

                                <span className="text-sm">Generating...</span>

                      <div>
                        <label className="block text-xs text-gray-400 mb-1">Calories</label>

    // ============== RECIPE DETAIL MODAL ==============
    function RecipeDetailModal(props) {
      var recipe = props.recipe;
      var onClose = props.onClose;
      var onSelect = props.onSelect;
      var onEdit = props.onEdit;
      var onGenerateImage = props.onGenerateImage;
      var showSelectButton = props.showSelectButton;
      var canGenerateImage = props.canGenerateImage;

      if (!recipe) return null;

      var portions = Math.round((PROTEIN_PER_MEAL / recipe.proteinPerServing) * 10) / 10;
      var isCustom = recipe.id && recipe.id.startsWith('custom-');

      function handleGenerateImage() {
        if (onGenerateImage) {
          setGeneratingImage(true);
          onGenerateImage();

          setTimeout(function() { setGeneratingImage(false); }, 20000);
        }
      }

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={onClose}>
          <div className="bg-white rounded-2xl w-full max-w-3xl max-h-[90vh] overflow-hidden shadow-2xl" onClick={function(e) { e.stopPropagation(); }}>
            {/* Header Image */}
            <div className="relative h-48 overflow-hidden">
              {recipe.image ? (
                <img src={recipe.image} alt={recipe.name} className="w-full h-full object-cover" />
              ) : (
                <div className="w-full h-full bg-gradient-to-br from-orange-100 to-red-100 flex items-center justify-center flex-col gap-3">
                  <span className="text-6xl">{recipe.emoji || '🍽️'}</span>
                  {canGenerateImage && (
                    <button
                      onClick={handleGenerateImage}
                      disabled={generatingImage}
                      className="px-4 py-2 bg-white/90 hover:bg-white text-gray-700 rounded-lg text-sm font-medium shadow-md flex items-center gap-2 disabled:opacity-50"
                    >
                      {generatingImage ? (
                        <>
                          <svg className="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                          Generating...
                        </>

      var allRecipes = props.allRecipes;
      var apiKey = props.apiKey;

      var [mode, setMode] = useState('quick'); // 'quick', 'library', 'ai'
      var [aiText, setAiText] = useState('');
      var [aiLoading, setAiLoading] = useState(false);
      var [error, setError] = useState('');
      var [showRecipes, setShowRecipes] = useState(false);
      var [librarySearch, setLibrarySearch] = useState('');

      if (!isOpen || !dayNum) return null;

      var date = new Date(year, month, dayNum);
      var dayName = date.toLocaleDateString('en-US', { weekday: 'long' });
      var dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

      // Calculate day totals
      var dayTotals = dayLog.reduce(function(acc, entry) {
        return {
          protein: acc.protein + (entry.protein || 0),
          calories: acc.calories + (entry.calories || 0),
          carbs: acc.carbs + (entry.carbs || 0),
          fat: acc.fat + (entry.fat || 0)
        };
      }, { protein: 0, calories: 0, carbs: 0, fat: 0 });

      function addFromRecipe(recipe) {
        var portions = Math.round((PROTEIN_PER_MEAL / recipe.proteinPerServing) * 10) / 10;
        onAddEntry({
          id: Date.now(),
          name: recipe.name,
          protein: Math.round(recipe.proteinPerServing * portions),
          calories: Math.round(recipe.caloriesPerServing * portions),
          carbs: Math.round(recipe.carbsPerServing * portions),
          fat: Math.round(recipe.fatPerServing * portions),
          time: new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }),
          source: 'recipe'
        });
        setShowRecipes(false);
      }

      function addQuickItem(item) {
        onAddEntry({
          id: Date.now(),
          name: item.name,
          protein: item.protein || 0,
          calories: item.calories || 0,
          carbs: item.carbs || 0,
          fat: item.fat || 0,
          time: new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }),
          source: 'quick'
        });
      }

      function parseWithAI() {
        if (!apiKey) {
          setError('Please add your Claude API key in Settings first.');
          return;
        }
        if (!aiText.trim()) {
          setError('Please describe what you ate.');
          return;
        }

        setAiLoading(true);
        setError('');

        var systemPrompt = 'You are a nutrition assistant. Parse food descriptions and return JSON with estimated nutrition. Return ONLY valid JSON array: [{"name": "Food name", "protein": 25, "calories": 400, "carbs": 30, "fat": 15}]. Be reasonable with estimates. For packaged foods, use typical values. For meals, estimate based on portions. Return ONLY the JSON array, no markdown.';

        fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: 'claude-3-haiku-20240307',
            max_tokens: 1024,
            system: systemPrompt,
            messages: [{ role: 'user', content: 'Parse this food: ' + aiText }]
          })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          setAiLoading(false);
          if (data.content && data.content[0] && data.content[0].text) {
            var text = data.content[0].text;
            var jsonMatch = text.match(/\[[\s\S]*\]/);
            if (jsonMatch) {
              try {
                var parsed = JSON.parse(jsonMatch[0]);
                parsed.forEach(function(item) {
                  onAddEntry({
                    id: Date.now() + Math.random(),
                    name: item.name,
                    protein: item.protein || 0,
                    calories: item.calories || 0,
                    carbs: item.carbs || 0,
                    fat: item.fat || 0,
                    time: new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }),
                    source: 'ai'
                  });
                });
                setAiText('');
                setMode('quick');
              } catch (e) {
                setError('Could not parse the food. Try being more specific.');
              }
            } else {
              setError('Could not parse the food. Try being more specific.');
            }
          } else if (data.error) {
            setError('API error: ' + (data.error.message || 'Try again.'));
          }
        })
        .catch(function(err) {
          setAiLoading(false);
          setError('Failed to connect: ' + err.message);
        });
      }

      var quickItems = [
        { name: 'Protein Shake', protein: 30, calories: 250, carbs: 5, fat: 3 },
        { name: 'Greek Yogurt', protein: 15, calories: 120, carbs: 8, fat: 4 },
        { name: 'Protein Bar', protein: 20, calories: 200, carbs: 22, fat: 8 },
        { name: '2 Eggs', protein: 12, calories: 140, carbs: 1, fat: 10 },
        { name: 'Chicken Breast (6oz)', protein: 45, calories: 280, carbs: 0, fat: 6 },

              {mode === 'ai' && (
                <div className="space-y-3">
                  <p className="text-sm text-gray-500">Describe what you ate, or paste nutrition info from a label.</p>

                    value={aiText}

                  >
                    {aiLoading ? 'Analyzing...' : (
                      <>
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                        Parse with AI
                      </>
                    )}
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function calcPortions(recipe) {
      return Math.round((PROTEIN_PER_MEAL / recipe.proteinPerServing) * 10) / 10;
    }

    // Recipe Picker Modal - for selecting recipes for meal plan slots
    function RecipePickerModal(props) {

      });

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={onClose}>
          <div className="bg-white rounded-2xl w-full max-w-2xl max-h-[85vh] overflow-hidden shadow-2xl" onClick={function(e) { e.stopPropagation(); }}>

            {/* Search */}
            <div className="p-4 border-b border-gray-100">
              <div className="relative">
                <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                <input

                  return (
                    <button

              {filteredRecipes.length === 0 ? (
                <p className="text-center text-gray-500 py-8">No recipes found</p>

                <div className="grid grid-cols-2 gap-3">
                  {filteredRecipes.map(function(recipe) {

                      <button
                        key={recipe.id}

                      >
                        <img src={recipe.image} alt="" className="w-16 h-16 rounded-lg object-cover flex-shrink-0" />

                          <div className="font-medium text-gray-900 text-sm truncate">{recipe.name}</div>
                          <div className="text-xs text-gray-500 mt-0.5">{recipe.proteinPerServing}g protein • {recipe.caloriesPerServing} cal</div>
                          <div className="text-xs text-gray-400 mt-0.5">{recipe.cookTime}</div>
                        </div>
                        <svg className="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        </div>
      );

    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(function() {
        try {
          var item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (e) { return initialValue; }
      });
      function setValue(value) {
        try {
          var valueToStore = typeof value === 'function' ? value(storedValue) : value;
          setStoredValue(valueToStore);
          window.localStorage.setItem(key, JSON.stringify(valueToStore));
        } catch (e) { console.error(e); }
      }
      return [storedValue, setValue];
    }

    // Progress Circle Component
    function ProgressCircle(props) {
      var percent = props.percent;
      var size = props.size || 80;
      var strokeWidth = props.strokeWidth || 6;
      var color = props.color || '#000';
      var label = props.label;
      var value = props.value;
      var target = props.target;

      var radius = (size - strokeWidth) / 2;
      var circumference = radius * 2 * Math.PI;
      var clampedPercent = Math.min(Math.max(percent, 0), 100);
      var offset = circumference - (clampedPercent / 100) * circumference;

      return (
        <div className="flex flex-col items-center">
          <div className="relative" style={{ width: size, height: size }}>
            <svg className="transform -rotate-90" width={size} height={size}>
              <circle cx={size/2} cy={size/2} r={radius} fill="none" stroke="#e5e5e5" strokeWidth={strokeWidth} />
              <circle cx={size/2} cy={size/2} r={radius} fill="none" stroke={color} strokeWidth={strokeWidth}
                strokeDasharray={circumference} strokeDashoffset={offset} strokeLinecap="round"
                style={{ transition: 'stroke-dashoffset 0.5s ease' }} />
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center">
              <span className="text-lg font-bold text-gray-900">{value}</span>
            </div>
          </div>
          <span className="mt-2 text-xs font-medium text-gray-500 uppercase tracking-wider">{label}</span>
          <span className="text-xs text-gray-400">of {target}</span>
        </div>
      );
    }

    // Recipe Slot Card
    function RecipeSlotCard(props) {
      var label = props.label;
      var dates = props.dates;
      var recipe = props.recipe;
      var onClick = props.onClick;
      var onClear = props.onClear;
      var onViewRecipe = props.onViewRecipe;

      function handleClear(e) {
        e.stopPropagation();
        if (onClear) onClear();
      }

      function handleClick() {
        if (recipe && onViewRecipe) {
          onViewRecipe(recipe);
        } else if (onClick) {
          onClick();
        }
      }

      return (
        <div onClick={handleClick} className={"relative cursor-pointer " + (recipe
          ? "text-left p-4 rounded-xl border-2 bg-white border-gray-200 hover:border-gray-300 transition-all"
          : "text-left p-4 rounded-xl border-2 bg-gray-50 border-dashed border-gray-300 hover:border-gray-400 transition-all"
        )}>
          {recipe && (
            <button onClick={handleClear} className="absolute top-2 right-2 w-6 h-6 bg-gray-100 hover:bg-red-100 text-gray-400 hover:text-red-500 rounded-full flex items-center justify-center transition-colors">
              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
          )}
          <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider">{label}</div>
          <div className="text-xs text-gray-400 mb-2">{dates}</div>
          {recipe ? (
            <div className="flex items-center gap-3">
              <img src={recipe.image} alt={recipe.name} className="w-12 h-12 rounded-lg object-cover" />
              <div>
                <div className="font-medium text-gray-900 text-sm">{recipe.name}</div>
                <div className="text-xs text-gray-500">{recipe.proteinPerServing}g protein</div>
              </div>
            </div>

            <div className="flex items-center gap-2 text-gray-400 mt-2">
              <span className="text-lg">+</span>
              <span className="text-sm">Select recipe</span>
            </div>
          )}
        </div>
      );
    }

    // Recipe Card for selection
    function RecipeCard(props) {
      var recipe = props.recipe;
      var onSelect = props.onSelect;
      var onEdit = props.onEdit;
      var onDelete = props.onDelete;
      var onQuickSelect = props.onQuickSelect;
      var onGenerateImage = props.onGenerateImage;
      var canGenerateImage = props.canGenerateImage;
      var isSelecting = props.isSelecting;
      var [generatingImage, setGeneratingImage] = useState(false);
      var portions = calcPortions(recipe);
      var dailyProtein = Math.round(recipe.proteinPerServing * portions * 2);
      var dailyCals = Math.round(recipe.caloriesPerServing * portions * 2);
      var isCustom = recipe.id && recipe.id.startsWith('custom-');
      var isIncomplete = !recipe.ingredients || recipe.ingredients.length === 0;

      function handleEdit(e) {
        e.stopPropagation();
        if (onEdit) onEdit();
      }

      function handleDelete(e) {
        e.stopPropagation();
        if (onDelete && confirm('Delete "' + recipe.name + '"? This cannot be undone.')) {
          onDelete();
        }
      }

      function handleQuickSelect(e) {
        e.stopPropagation();
        if (onQuickSelect) onQuickSelect();
      }

      return (
        <div onClick={onSelect} className={"bg-white rounded-2xl border overflow-hidden cursor-pointer hover:shadow-lg transition-all relative " + (isSelecting ? "border-green-400 ring-2 ring-green-200" : "border-gray-200 hover:border-gray-400")}>
          {isCustom && (
            <div className="absolute top-3 left-3 z-10 flex gap-2">

                <span className="text-xs font-medium bg-amber-100 text-amber-700 px-2 py-1 rounded-full">Needs Details</span>

          )}
          <div className="absolute top-3 right-3 z-10 flex gap-1">

              <svg className="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
            </button>
            {isCustom && (
              <button onClick={handleDelete} className="w-8 h-8 bg-white/90 hover:bg-red-100 rounded-full flex items-center justify-center shadow-md" title="Delete recipe">
                <svg className="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
              </button>

          </div>
          <div className="aspect-video overflow-hidden relative">

              <div className="w-full h-full bg-gradient-to-br from-orange-100 to-red-100 flex items-center justify-center flex-col gap-2 hover:scale-105 transition-transform duration-500">
                <span className="text-5xl">{recipe.emoji || '🍽️'}</span>

    // Generate shopping list from recipes
    // Categorize ingredient by name
    function categorizeIngredient(itemName) {
      if (!itemName) return 'Other';
      var name = String(itemName).toLowerCase();

      // Meat & Seafood
      if (/chicken|beef|lamb|mutton|goat|fish|shrimp|prawn|salmon|tuna|meat|gosht|keema|qeema/.test(name)) {
        return 'Meat & Seafood';
      }
      // Dairy
      if (/milk|cream|cheese|yogurt|yoghurt|butter|paneer|ghee|dahi|mozzarella|cheddar/.test(name)) {
        return 'Dairy';
      }
      // Produce
      if (/onion|tomato|potato|pepper|chili|chilli|garlic|ginger|cilantro|coriander|mint|lemon|lime|carrot|spinach|lettuce|cucumber|cabbage|cauliflower|broccoli|okra|bhindi|eggplant|baingan|peas|beans|capsicum|bell pepper|green onion|scallion/.test(name)) {
        return 'Produce';
      }
      // Spices & Seasonings
      if (/masala|cumin|turmeric|coriander powder|chili powder|paprika|pepper|salt|bay leaf|cardamom|cinnamon|clove|nutmeg|saffron|fennel|mustard seed|fenugreek|curry|tikka|tandoori|biryani|kalonji|nigella|ajwain|hing|asafoetida/.test(name)) {
        return 'Spices & Seasonings';
      }
      // Pantry & Grains
      if (/rice|flour|bread|oil|stock|broth|sauce|paste|sugar|honey|vinegar|noodle|pasta|lentil|dal|daal|chickpea|bean|cornflour|cornstarch|breadcrumb|sesame|soy/.test(name)) {
        return 'Pantry & Grains';
      }
      // Eggs
      if (/egg/.test(name)) {
        return 'Eggs';
      }
      // Default
      return 'Other';
    }

    function generateShoppingList(mealPlan, recipeList) {
      var ingredientMap = {};
      var slots = ['week1_sun', 'week1_wed', 'week2_sun', 'week2_wed'];

      // Determine correct store based on item - ALL meats go to Apna Bazaar (halal)
      function getCorrectStore(itemName, originalStore) {
        if (!itemName) return originalStore || 'walmart';
        var name = String(itemName).toLowerCase();
        // All meats and seafood go to Apna Bazaar for halal
        if (/chicken|beef|lamb|mutton|goat|fish|shrimp|prawn|salmon|tuna|meat|gosht|keema|qeema|mince|steak|chop|drumstick|thigh|breast|wing|leg|ground|boneless|bone-in/.test(name)) {
          return 'apna';
        }
        // South Asian specialty items
        if (/garam masala|cumin|coriander|turmeric|haldi|mirch|masala|ghee|atta|basmati|biryani|cardamom|elaichi|cinnamon|dalchini|clove|laung|bay leaf|tej patta|fennel|saunf|fenugreek|methi|asafoetida|hing|curry leaves|tamarind|imli|jaggery|gur|paneer|chana|dal|lentil|besan/.test(name)) {
          return 'apna';
        }
        return originalStore || 'walmart';
      }

      // Unit conversion to standardize (convert to base units where possible)
      function normalizeUnit(amount, unit) {
        if (!unit) return { amount: amount || 0, unit: 'pcs' };
        var u = String(unit).toLowerCase().trim();
        var amt = Number(amount) || 0;
        // Volume conversions to tbsp
        if (u === 'cup' || u === 'cups') return { amount: amt * 16, unit: 'tbsp' };
        if (u === 'tsp') return { amount: amt / 3, unit: 'tbsp' };
        // Weight conversions to g
        if (u === 'kg') return { amount: amt * 1000, unit: 'g' };
        // Return as-is for other units
        return { amount: amt, unit: u };
      }

      // Format amount nicely
      function formatAmount(amount, unit) {
        var amt = Number(amount) || 0;
        var u = unit || 'pcs';
        // Convert back to larger units if appropriate
        if (u === 'tbsp' && amt >= 16) {
          var cups = Math.floor(amt / 16);
          var remaining = amt % 16;
          if (remaining === 0) return cups + ' cup' + (cups > 1 ? 's' : '');
          return cups + ' cup' + (cups > 1 ? 's' : '') + ' + ' + Math.round(remaining * 10) / 10 + ' tbsp';
        }
        if (u === 'g' && amt >= 1000) {
          return (Math.round(amt / 100) / 10) + ' kg';
        }
        return (Math.round(amt * 100) / 100) + ' ' + u;
      }

      slots.forEach(function(slot) {
        var recipeId = mealPlan[slot];
        if (!recipeId) return;
        var recipe = recipeList.find(function(r) { return r.id === recipeId; });
        if (!recipe || !recipe.ingredients) return;

        recipe.ingredients.forEach(function(ing) {
          if (!ing || !ing.item) return; // Skip invalid ingredients
          // Key by item name + store only (not unit) to combine duplicates
          var itemName = String(ing.item).trim();
          // Use getCorrectStore to ensure meats go to Apna Bazaar (halal)
          var storeName = getCorrectStore(itemName, ing.store);
          var key = itemName.toLowerCase() + '|||' + storeName;
          var normalized = normalizeUnit(ing.amount, ing.unit);

          if (!ingredientMap[key]) {
            ingredientMap[key] = { item: itemName, store: storeName, unit: normalized.unit, amount: 0 };
          }

          // If same base unit, add amounts
          if (ingredientMap[key].unit === normalized.unit) {
            ingredientMap[key].amount += normalized.amount;
          } else {
            // Different unit types (e.g., pcs vs g) - keep the one with more amount or create combined display
            // For simplicity, just add to existing if units are compatible volume/weight, else keep larger
            ingredientMap[key].amount += normalized.amount;
          }
        });
      });

      var all = Object.values(ingredientMap).map(function(i) {
        return { item: i.item, store: i.store, unit: formatAmount(i.amount, i.unit) };
      });

      return {
        walmart: all.filter(function(i) { return i.store === 'walmart'; }).sort(function(a, b) { return a.item.localeCompare(b.item); }),
        apna: all.filter(function(i) { return i.store === 'apna'; }).sort(function(a, b) { return a.item.localeCompare(b.item); })
      };
    }

      // Cloud Sync State
      var [syncStatus, setSyncStatus] = useState('disconnected');

      // Initialize JSONbin connection check
      useEffect(function() {
        var jsonbinKey = localStorage.getItem('mealprep-jsonbin-key');

        if (jsonbinKey && jsonbinId) {

      // Push data to JSONbin.io
      function pushToCloud() {
        var jsonbinKey = localStorage.getItem('mealprep-jsonbin-key');
        var jsonbinId = localStorage.getItem('mealprep-jsonbin-id');

        if (!jsonbinKey || !jsonbinId) {
          alert('Please configure cloud sync in Settings first.');
          return;
        }

        setSyncStatus('syncing');

        var data = { updated: new Date().toISOString() };
        SYNC_KEYS.forEach(function(key) {
          var val = localStorage.getItem(key);
          if (val) {
            try { data[key] = JSON.parse(val); } catch (e) {}
          }
        });

        fetch('https://api.jsonbin.io/v3/b/' + jsonbinId, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': jsonbinKey
          },
          body: JSON.stringify(data)
        })
        .then(function(res) { return res.json(); })
        .then(function(result) {
          if (result.metadata) {
            console.log('Data pushed to JSONbin');
            setSyncStatus('connected');
            alert('Data synced to cloud!');
          } else {
            console.error('Sync error:', result);
            alert('Sync failed: ' + (result.message || 'Unknown error'));
            setSyncStatus('connected');
          }
        })
        .catch(function(err) {
          console.error('Sync error:', err);
          alert('Sync failed: ' + err.message);
          setSyncStatus('connected');
        });
      }

      // Pull data from JSONbin.io
      function pullFromCloud() {
        var jsonbinKey = localStorage.getItem('mealprep-jsonbin-key');
        var jsonbinId = localStorage.getItem('mealprep-jsonbin-id');

        if (!jsonbinKey || !jsonbinId) {
          alert('Please configure cloud sync in Settings first.');
          return;
        }

        setSyncStatus('syncing');

        fetch('https://api.jsonbin.io/v3/b/' + jsonbinId + '/latest', {
          method: 'GET',
          headers: {
            'X-Master-Key': jsonbinKey
          }
        })
        .then(function(res) { return res.json(); })
        .then(function(result) {
          if (result.record) {
            Object.keys(result.record).forEach(function(key) {
              if (key.startsWith('mealprep-')) {
                localStorage.setItem(key, JSON.stringify(result.record[key]));
              }
            });
            alert('Data synced from cloud! Refreshing...');
            window.location.reload();
          } else {
            console.error('Pull error:', result);
            alert('Pull failed: ' + (result.message || 'No data found'));
            setSyncStatus('connected');
          }
        })
        .catch(function(err) {
          console.error('Pull error:', err);
          alert('Pull failed: ' + err.message);
          setSyncStatus('connected');
        });
      }

      // Cleanup: Remove duplicate custom copies (keep only one per originalId)
      useEffect(function() {
        var seen = {};
        var hasdupes = false;
        customRecipes.forEach(function(r) {
          if (r.originalId) {
            if (seen[r.originalId]) hasdupes = true;
            seen[r.originalId] = true;
          }
        });
        if (hasdupes) {
          // Keep only the latest custom copy for each originalId
          var latestByOriginal = {};
          customRecipes.forEach(function(r) {
            if (r.originalId) {
              if (!latestByOriginal[r.originalId] || r.id > latestByOriginal[r.originalId].id) {
                latestByOriginal[r.originalId] = r;
              }
            }
          });
          var cleaned = customRecipes.filter(function(r) {
            if (!r.originalId) return true; // Keep recipes without originalId
            return latestByOriginal[r.originalId] && latestByOriginal[r.originalId].id === r.id;
          });
          if (cleaned.length !== customRecipes.length) {
            setCustomRecipes(cleaned);
          }
        }
      }, []);

      // Get IDs of built-in recipes that have custom copies (to hide the originals)
      var customizedOriginalIds = customRecipes
        .filter(function(r) { return r.originalId; })
        .map(function(r) { return r.originalId; });

      // Combine built-in and custom recipes, applying image overrides to built-in ones
      // Hide built-in recipes if a custom copy exists (to prevent duplicates)
      var allRecipes = RECIPES
        .filter(function(recipe) {
          return customizedOriginalIds.indexOf(recipe.id) === -1;
        })
        .map(function(recipe) {
          // Apply image override if exists for this built-in recipe
          if (recipeImageOverrides[recipe.id]) {
            return Object.assign({}, recipe, { image: recipeImageOverrides[recipe.id] });
          }
          return recipe;
        })
        .concat(customRecipes);

      function saveCustomRecipe(recipe) {
        setCustomRecipes(function(prev) { return prev.concat([recipe]); });
      }

      function updateCustomRecipe(updatedRecipe) {
        setCustomRecipes(function(prev) {
          return prev.map(function(r) {
            if (r.id === updatedRecipe.id) {
              return updatedRecipe;
            }
            return r;
          });
        });
      }

      function deleteCustomRecipe(recipeId) {
        setCustomRecipes(function(prev) {
          return prev.filter(function(r) { return r.id !== recipeId; });
        });
        // Also remove from meal plan if it was used
        setMealPlan(function(prev) {
          var updated = Object.assign({}, prev);
          Object.keys(updated).forEach(function(key) {
            if (updated[key] === recipeId) {
              updated[key] = null;
            }
          });
          return updated;
        });
      }

      function handleSaveRecipe(recipe) {
        // Check if it's an existing custom recipe (editing) or new
        var existingIndex = customRecipes.findIndex(function(r) { return r.id === recipe.id; });
        if (existingIndex >= 0) {
          updateCustomRecipe(recipe);
        } else if (recipe.originalId) {
          // Check if a custom copy already exists for this built-in recipe
          var existingCopyIndex = customRecipes.findIndex(function(r) { return r.originalId === recipe.originalId; });
          if (existingCopyIndex >= 0) {
            // Update the existing copy (use its ID to maintain consistency)
            var updatedRecipe = Object.assign({}, recipe, { id: customRecipes[existingCopyIndex].id });
            updateCustomRecipe(updatedRecipe);
          } else {
            saveCustomRecipe(recipe);
          }
        } else {
          saveCustomRecipe(recipe);
        }
      }

      function openEditRecipe(recipe) {
        // Allow editing any recipe - if it's built-in, we'll create or find a custom copy
        if (recipe.id.startsWith('custom-')) {
          // Editing existing custom recipe
          setEditingRecipe(recipe);
        } else {
          // Check if a custom copy already exists for this built-in recipe
          var existingCustomCopy = customRecipes.find(function(r) {
            return r.originalId === recipe.id;
          });

          if (existingCustomCopy) {
            // Edit the existing custom copy
            setEditingRecipe(existingCustomCopy);
          } else {
            // Create a new custom copy of the built-in recipe
            var customCopy = Object.assign({}, recipe, {
              id: 'custom-' + Date.now(),
              originalId: recipe.id  // Keep reference to original
            });
            setEditingRecipe(customCopy);
          }

        setShowAddRecipe(true);

      function deleteRecipe(recipeId) {

        if (recipeId.startsWith('custom-')) {
          setCustomRecipes(function(prev) {
            return prev.filter(function(r) { return r.id !== recipeId; });
          });
          // Also remove from meal plan if it's assigned
          setMealPlan(function(prev) {
            var updated = Object.assign({}, prev);
            Object.keys(updated).forEach(function(key) {
              if (updated[key] === recipeId) {
                updated[key] = null;
              }
            });
            return updated;

      var [mealPlan, setMealPlan] = useLocalStorage('mealprep-plan-v7', {
        week1_sun: null,

        week2_sun: null,

      });

      // Get first day of month and days in month
      var firstDayOfMonth = new Date(viewYear, viewMonth, 1).getDay();
      var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      var monthName = new Date(viewYear, viewMonth, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      // Generate calendar days
      var calendarDays = [];
      for (var i = 0; i < firstDayOfMonth; i++) {
        calendarDays.push(null);
      }
      for (var d = 1; d <= daysInMonth; d++) {
        calendarDays.push(d);
      }

      // Determine which week a date falls into (1-2) and which day
      function getWeekAndDay(dayNum) {
        if (!dayNum) return null;
        var date = new Date(viewYear, viewMonth, dayNum);
        var dayOfWeek = date.getDay(); // 0=Sun, 3=Wed
        var weekOfMonth = Math.ceil((dayNum + firstDayOfMonth) / 7);

        // Map to our 2-week cycle (weeks 1-2, then repeats)
        var cycleWeek = ((weekOfMonth - 1) % 2) + 1; // 1 or 2

        if (dayOfWeek === 0 || dayOfWeek === 1 || dayOfWeek === 2) {
          // Sun, Mon, Tue - use Sunday cook
          return { week: cycleWeek, cook: 'sun' };
        } else {
          // Wed, Thu, Fri, Sat - use Wednesday cook
          return { week: cycleWeek, cook: 'wed' };
        }
      }

      function getRecipeForDay(dayNum) {
        var info = getWeekAndDay(dayNum);
        if (!info) return null;
        var slotKey = 'week' + info.week + '_' + info.cook;
        var recipeId = mealPlan[slotKey];
        if (!recipeId) return null;
        return allRecipes.find(function(r) { return r.id === recipeId; });
      }

      function getDayMacros(dayNum) {
        var recipe = getRecipeForDay(dayNum);

        return {
          protein: Math.round(recipe.proteinPerServing * portions * 2),
          calories: Math.round(recipe.caloriesPerServing * portions * 2),
          carbs: Math.round(recipe.carbsPerServing * portions * 2),
          fat: Math.round(recipe.fatPerServing * portions * 2),

      function isCookDay(dayNum) {

      function getDayActualMacros(dayNum) {
        var log = getDayLog(dayNum);
        return log.reduce(function(acc, entry) {

      // AI Grocery List Cleanup
      function cleanupGroceryList() {
        if (!claudeApiKey) {
          alert('Please add your Claude API key in Settings first.');
          return;
        }

        var allItems = shoppingList.walmart.concat(shoppingList.apna);

        // Add pantry items that need restocking
        var pantryItems = DEFAULT_BEVERAGES.concat(DEFAULT_SNACKS).concat(DEFAULT_BREAKFAST).concat(customPantryItems)
          .filter(function(item) { return pantryNeeds[item.id]; })
          .map(function(item) {
            return {
              item: item.name,
              amount: '1',
              unit: item.items ? '(' + item.items.join(', ') + ')' : 'pack',
              store: item.store || 'walmart'
            };
          });

        allItems = allItems.concat(pantryItems);

        if (allItems.length === 0) {
          alert('No items in your shopping list.');
          return;
        }

        setGroceryAiLoading(true);
        setSmartGroceryList(null);

        var itemList = allItems.map(function(i) {
