      // AI-powered add item to shopping list (categorizes and assigns store)
      function addItemWithAI(itemText) {
        if (!itemText.trim()) return;

        var items = itemText.split(/[\n,;]+/).map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
        if (items.length === 0) return;

        // Filter out items that already exist in the list
        if (smartGroceryList && smartGroceryList.stores) {
          items = items.filter(function(itemName) {
            return !smartGroceryList.stores.some(function(store) {
              return store.categories && store.categories.some(function(c) {
                return c.items && c.items.some(function(i) { return i.item.toLowerCase() === itemName.toLowerCase(); });
              });
            });
          });
        }
        if (items.length === 0) {
          setNewPantryItem('');
          return; // All items already in list
        }

        // If no API key, add to Walmart > Other as fallback
        if (!claudeApiKey) {
          setSmartGroceryList(function(prev) {
            var base = prev && prev.stores ? prev : { stores: [
              { name: 'Walmart', categories: [] },
              { name: 'Apna Bazaar', categories: [] }
            ]};
            var newStores = base.stores.map(function(store) {
              if (store.name === 'Walmart') {
                var cats = store.categories ? store.categories.slice() : [];
                var otherIdx = cats.findIndex(function(c) { return c.name === 'Other'; });
                var newItems = items.map(function(item) { return { item: item, amount: '' }; });
                if (otherIdx === -1) {
                  cats.push({ name: 'Other', items: newItems });
                } else {
                  cats[otherIdx] = Object.assign({}, cats[otherIdx], { items: (cats[otherIdx].items || []).concat(newItems) });
                }
                return Object.assign({}, store, { categories: cats });
              }
              return store;
            });
            return { stores: newStores };
          });
          setNewPantryItem('');
          return;
        }

        setGroceryAiLoading(true);

        var systemPrompt = 'You categorize grocery items for a Pakistani household shopping at Walmart and Apna Bazaar (halal South Asian store). CRITICAL RULE: ALL meats (chicken, beef, lamb, goat, mutton, fish, seafood, shrimp, keema, ground meat, etc.) MUST go to "Apna Bazaar" because they need halal meat. Also Apna Bazaar for: South Asian spices, basmati rice, ghee, atta, desi ingredients. Walmart for: produce, dairy, eggs, general groceries, Western items. Categories: Meat & Seafood, Dairy, Produce, Spices & Seasonings, Pantry & Grains, Frozen, Beverages, Snacks, Other. Return JSON: {"items": [{"name": "item name", "store": "Walmart or Apna Bazaar", "category": "category name"}]}. Return ONLY valid JSON.';

        fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': claudeApiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: 'claude-3-haiku-20240307',
            max_tokens: 1024,
            system: systemPrompt,
            messages: [{ role: 'user', content: 'Categorize these items: ' + items.join(', ') }]
          })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          setGroceryAiLoading(false);
          if (data.content && data.content[0] && data.content[0].text) {
            var text = data.content[0].text;
            var jsonMatch = text.match(/\{[\s\S]*\}/);
            if (jsonMatch) {
              try {
                var parsed = JSON.parse(jsonMatch[0]);
                if (parsed.items && parsed.items.length > 0) {
                  // Normalize store names for each item - case insensitive
                  var normalizedItems = parsed.items.map(function(i) {
                    var storeLower = (i.store || '').toLowerCase();
                    return {
                      name: i.name,
                      store: storeLower.includes('walmart') ? 'Walmart' : 'Apna Bazaar',
                      category: i.category || 'Other'
                    };
                  });

                  setSmartGroceryList(function(prev) {
                    var base = prev && prev.stores ? prev : { stores: [
                      { name: 'Walmart', categories: [] },
                      { name: 'Apna Bazaar', categories: [] }
                    ]};

                    var newStores = base.stores.map(function(store) {
                      var storeItems = normalizedItems.filter(function(i) { return i.store === store.name; });
                      if (storeItems.length === 0) return store;

                      var cats = store.categories ? store.categories.slice() : [];
                      storeItems.forEach(function(item) {
                        var catIdx = cats.findIndex(function(c) { return c.name === item.category; });
                        var newItem = { item: item.name, amount: '' };
                        if (catIdx === -1) {
                          cats.push({ name: item.category, items: [newItem] });
                        } else {
                          cats[catIdx] = Object.assign({}, cats[catIdx], { items: (cats[catIdx].items || []).concat([newItem]) });
                        }
                      });
                      return Object.assign({}, store, { categories: cats });
                    });

                    return { stores: newStores };
                  });
                }
              } catch (e) {
                console.error('Parse error:', e);
              }
            }
          }
        })
        .catch(function(err) {
          setGroceryAiLoading(false);
          console.error('AI error:', err);
        });

        setNewPantryItem('');
      }

          })

        .then(function(data) {

                    return Object.assign({}, r, { image: imageUrl });
                  }
                  return r;

              // It's a built-in recipe - store image in overrides (no duplicate entry)
              setRecipeImageOverrides(function(prev) {

                            <p className="text-blue-100 text-sm">Paste your grocery list</p>
                          </div>
                          <button onClick={function() { setShowRemindersImport(false); }} className="text-white/80 hover:text-white">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                          </button>
                        </div>
                      </div>
                      <div className="p-4 space-y-4">
                        <textarea
                          value={remindersImportText}
                          onChange={function(e) { setRemindersImportText(e.target.value); }}
                          placeholder="Paste your list here (one item per line)..."
                          className="w-full h-40 px-3 py-2 text-sm border border-gray-300 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                        <div className="flex gap-2">
                          <button
                            onClick={function() { navigator.clipboard.readText().then(function(text) { if (text) setRemindersImportText(text); }); }}
                            className="flex-1 py-3 bg-gray-100 text-gray-700 rounded-lg font-medium hover:bg-gray-200"
                          >
                            Paste
                          </button>
                          <button
                            onClick={function() {
                              if (remindersImportText.trim()) {
                                addItemWithAI(remindersImportText);
                                setRemindersImportText('');
                                setShowRemindersImport(false);
                              }
                            }}
                            disabled={!remindersImportText.trim() || groceryAiLoading}
                            className="flex-[2] py-3 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-lg font-medium hover:from-purple-700 hover:to-indigo-700 disabled:opacity-50 flex items-center justify-center gap-2"
                          >
                            {groceryAiLoading ? (
                              <>
                                <svg className="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                                Adding...
                              </>
                            ) : (
                              <>
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                                Add with AI
                              </>
                            )}
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* Shopping List - Recipe Ingredients + Manually Added */}
                {(function() {
                  // Combine recipe ingredients with manually added items
                  var walmartCategories = {};
                  var apnaCategories = {};

                  // Add recipe ingredients (from meal plan) - organized by category
                  if (shoppingList.walmart) {
                    shoppingList.walmart.forEach(function(item, idx) {
                      if (!item || !item.item) return;
                      if (deletedGroceryItems['recipe-w-' + idx]) return;
                      var cat = categorizeIngredient(item.item);
                      if (!walmartCategories[cat]) walmartCategories[cat] = [];
                      walmartCategories[cat].push({
                        item: item.item,
                        amount: item.unit || '',
                        key: 'recipe-w-' + idx,
                        source: 'recipe'
                      });
                    });
                  }

                  if (shoppingList.apna) {
                    shoppingList.apna.forEach(function(item, idx) {
                      if (!item || !item.item) return;
                      if (deletedGroceryItems['recipe-a-' + idx]) return;
                      var cat = categorizeIngredient(item.item);
                      if (!apnaCategories[cat]) apnaCategories[cat] = [];
                      apnaCategories[cat].push({
                        item: item.item,
                        amount: item.unit || '',
                        key: 'recipe-a-' + idx,
                        source: 'recipe'
                      });
                    });
                  }

                  // Add manually added items (from smartGroceryList)
                  if (smartGroceryList && smartGroceryList.stores) {
                    smartGroceryList.stores.forEach(function(store) {
                      var isWalmart = store.name.toLowerCase().includes('walmart');
                      var targetCats = isWalmart ? walmartCategories : apnaCategories;
                      if (store.categories) {
                        store.categories.forEach(function(cat) {
                          if (cat.items) {
                            cat.items.forEach(function(item, idx) {
                              var catName = cat.name || 'Other';
                              if (!targetCats[catName]) targetCats[catName] = [];
                              targetCats[catName].push({
                                item: item.item,
                                amount: item.amount || '',
                                key: 'manual-' + store.name + '-' + catName + '-' + idx,
                                source: 'manual'
                              });
                            });
                          }
                        });
                      }
                    });
                  }

                  var walmartTotal = Object.values(walmartCategories).reduce(function(sum, items) { return sum + items.length; }, 0);
                  var apnaTotal = Object.values(apnaCategories).reduce(function(sum, items) { return sum + items.length; }, 0);

                  // Helper to render a store column
                  function renderStoreColumn(storeName, categories, total, isWalmart) {
                    var catNames = Object.keys(categories);
                    // Sort categories in logical order
                    var categoryOrder = ['Meat & Seafood', 'Dairy', 'Produce', 'Eggs', 'Pantry & Grains', 'Spices & Seasonings', 'Other'];
                    catNames.sort(function(a, b) {
                      var aIdx = categoryOrder.indexOf(a);
                      var bIdx = categoryOrder.indexOf(b);
                      if (aIdx === -1) aIdx = 999;
                      if (bIdx === -1) bIdx = 999;
                      return aIdx - bIdx;
                    });

                    return (
                      <div className="bg-white rounded-xl border border-gray-200 p-4">
                        <div className="flex items-center gap-3 mb-3 pb-2 border-b border-gray-100">
                          <div className={"w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm " + (isWalmart ? 'bg-blue-100 text-blue-600' : 'bg-orange-100 text-orange-600')}>
                            {isWalmart ? 'W' : 'A'}
                          </div>
                          <h4 className="font-medium text-gray-900 flex-1">{storeName}</h4>
                          <span className="text-xs text-gray-400">{total} items</span>
                        </div>

                        {total === 0 ? (
                          <p className="text-sm text-gray-400 text-center py-4">No items yet</p>
                        ) : (
                          <div className="space-y-3">
                            {catNames.map(function(catName) {
                              var items = categories[catName];
                              if (!items || items.length === 0) return null;
                              return (
                                <div key={catName}>
                                  <h5 className="text-xs font-medium uppercase mb-1 text-gray-400">{catName}</h5>
                                  <div className="space-y-1">
                                    {items.map(function(item) {
                                      return (
                                        <div key={item.key} className={"flex items-center gap-2 py-1 rounded " + (checkedItems[item.key] ? 'bg-green-50' : 'hover:bg-gray-50')}>
                                          <button onClick={function() { setCheckedItems(function(prev) { var n = Object.assign({}, prev); n[item.key] = !n[item.key]; return n; }); }}
                                            className={"flex items-center gap-2 text-left text-sm flex-1 " + (checkedItems[item.key] ? 'text-gray-400 line-through' : 'text-gray-700')}>
                                            <div className={"w-4 h-4 rounded border flex-shrink-0 flex items-center justify-center " + (checkedItems[item.key] ? 'border-green-500 bg-green-500' : 'border-gray-300')}>
                                              {checkedItems[item.key] && <svg className="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>}
                                            </div>
                                            <span className="flex-1">{item.item}</span>
                                            {item.amount && <span className="text-xs text-gray-400">{item.amount}</span>}
                                          </button>
                                          <button
                                            onClick={function() {
                                              if (item.source === 'recipe') {
                                                setDeletedGroceryItems(function(prev) { var n = Object.assign({}, prev); n[item.key] = true; return n; });
                                              } else {
                                                // Remove from smartGroceryList
                                                setSmartGroceryList(function(prev) {
                                                  if (!prev || !prev.stores) return prev;
                                                  var newStores = prev.stores.map(function(store) {
                                                    if (!store.categories) return store;
                                                    var newCats = store.categories.map(function(cat) {
                                                      if (!cat.items) return cat;
                                                      return Object.assign({}, cat, {
                                                        items: cat.items.filter(function(it) { return it.item !== item.item; })
                                                      });
                                                    }).filter(function(cat) { return cat.items && cat.items.length > 0; });
                                                    return Object.assign({}, store, { categories: newCats });
                                                  });
                                                  return Object.assign({}, prev, { stores: newStores });
                                                });
                                              }
                                            }}
                                            className="p-1 text-gray-400 hover:text-red-500 rounded flex-shrink-0"
                                          >
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                                          </button>
                                        </div>
                                      );
                                    })}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    );
                  }

                  return (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {renderStoreColumn('Walmart', walmartCategories, walmartTotal, true)}
                      {renderStoreColumn('Apna Bazaar', apnaCategories, apnaTotal, false)}
                    </div>
                  );
                })()}

              </div>
            )}

            {/* Recipes View */}
            {mainSection === 'mealprep' && mealPrepView === 'recipes' && (
              <div>
                {selectedSlot ? (
                  <div className="mb-6 p-4 bg-green-50 border border-green-200 rounded-xl flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center">
                        <svg className="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
                      </div>
                      <div>
                        <h2 className="text-lg font-medium text-green-800">Select a Recipe</h2>
                        <p className="text-sm text-green-600">
                          {selectedSlot.replace('week', 'Week ').replace('_sun', ' • Sunday Cook').replace('_wed', ' • Wednesday Cook')}
                        </p>
                      </div>
                    </div>
                    <button onClick={function() { setSelectedSlot(null); setMealPrepView('plan'); }} className="px-4 py-2 text-sm font-medium text-green-700 hover:text-green-900 hover:bg-green-100 rounded-lg">
                      Cancel
                    </button>
                  </div>
                ) : (
                  <h2 className="text-xl text-gray-800 serif mb-4">Browse</h2>
                )}

                {/* Search Bar - works for all categories with AI add */}
                <div className="mb-4">
                  <div className="relative max-w-lg">
                    <svg className={"absolute left-3 w-5 h-5 text-gray-400 " + (recipeSearch.includes('\n') ? "top-3" : "top-1/2 -translate-y-1/2")} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    <textarea
                      placeholder={categoryFilter === 'breakfast' ? "Search or add breakfast... paste recipe to import" : "Search or add recipe... paste to import"}
                      value={recipeSearch}
                      onChange={function(e) { setRecipeSearch(e.target.value); }}
                      onKeyDown={function(e) {
                        if (e.key === 'Enter' && !e.shiftKey && recipeSearch.trim() && !recipeSearch.includes('\n') && !addingRecipeAI) {
                          e.preventDefault();
                          var searchName = recipeSearch.trim().toLowerCase();
                          var isExisting = categoryFilter === 'breakfast'
                            ? DEFAULT_BREAKFAST.some(function(item) { return !hiddenPantryItems.includes(item.id) && item.name.toLowerCase() === searchName; })
                            : allRecipes.some(function(r) { return r.name.toLowerCase() === searchName; });
                          if (!isExisting) {
                            generateRecipeWithAI(recipeSearch.trim(), categoryFilter === 'all' ? 'chicken' : categoryFilter);
                          }
                        }
                      }}
                      rows={recipeSearch.includes('\n') ? 4 : 1}
                      className={"w-full pl-10 py-2.5 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-gray-900 resize-none " + (recipeSearch.trim() ? "pr-28" : "pr-4")}
                    />
                    {/* Add with AI button - shows for all categories */}
                    {recipeSearch.trim() && (function() {
                      var searchName = recipeSearch.trim().split('\n')[0].toLowerCase();
                      var isExisting = categoryFilter === 'breakfast'
                        ? DEFAULT_BREAKFAST.some(function(item) { return !hiddenPantryItems.includes(item.id) && item.name.toLowerCase() === searchName; })
                        : allRecipes.some(function(r) { return r.name.toLowerCase() === searchName; });
                      return !isExisting;
                    })() && (
                      <button
                        onClick={function() {
                          if (addingRecipeAI) return;
                          generateRecipeWithAI(recipeSearch.trim(), categoryFilter === 'all' ? 'chicken' : categoryFilter);
                        }}
                        disabled={addingRecipeAI}
                        className={"absolute right-2 px-3 py-1.5 bg-orange-500 text-white rounded-lg text-xs font-medium hover:bg-orange-600 disabled:opacity-50 flex items-center gap-1 " + (recipeSearch.includes('\n') ? "top-2" : "top-1/2 -translate-y-1/2")}
                      >
                        {addingRecipeAI ? (
                          <>
                            <svg className="w-3 h-3 animate-spin" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                            Adding...
                          </>
                        ) : (
                          <>
                            <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                            {recipeSearch.includes('\n') || recipeSearch.length > 50 ? 'Parse Recipe' : 'Add with AI'}
                          </>
                        )}
                      </button>
                    )}
                  </div>
                  <p className="text-xs text-gray-400 mt-1 ml-1">Press Enter to add • Paste full recipe to import</p>
                </div>

                {/* Category Filters */}
                <div className="flex flex-wrap gap-2 mb-6">
                  {[
                    { id: 'all', label: 'All' },
                    { id: 'breakfast', label: '🍳 Breakfast' },
                    { id: 'chicken', label: 'Chicken' },
                    { id: 'beef', label: 'Beef' },
                    { id: 'seafood', label: 'Seafood' },
                    { id: 'vegetarian', label: 'Vegetarian' }
                  ].map(function(cat) {
                    return (
                      <button
                        key={cat.id}
                        onClick={function() { setCategoryFilter(cat.id); }}
                        className={categoryFilter === cat.id
                          ? "px-4 py-2 rounded-full text-sm font-medium bg-gray-900 text-white"
                          : "px-4 py-2 rounded-full text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200"
                        }
                      >
                        {cat.label}
                      </button>
                    );
                  })}
                </div>

                {/* Breakfast Content */}
                {categoryFilter === 'breakfast' ? (
                  <div className="space-y-6">
                    <div className="flex items-center justify-between flex-wrap gap-2">
                      <p className="text-sm text-gray-500">Click to view details • Search to add new</p>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={function() { setBreakfastEditMode(!breakfastEditMode); }}
                          className={breakfastEditMode ? "px-3 py-1.5 bg-red-100 text-red-700 rounded-lg text-sm font-medium hover:bg-red-200 flex items-center gap-1" : "px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 flex items-center gap-1"}
                        >
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={breakfastEditMode ? "M6 18L18 6M6 6l12 12" : "M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"} /></svg>
                          {breakfastEditMode ? 'Done' : 'Delete'}
                        </button>
                        <button
                          onClick={suggestBreakfast}
                          disabled={suggestingBreakfast}
                          className="px-3 py-1.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white rounded-lg text-sm font-medium hover:from-orange-600 hover:to-amber-600 disabled:opacity-50 flex items-center gap-1"
                        >
                          {suggestingBreakfast ? (
                            <svg className="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                          ) : (
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                          )}
                          AI Suggest
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                      {DEFAULT_BREAKFAST.filter(function(item) {
                        var matchesSearch = !recipeSearch || item.name.toLowerCase().includes(recipeSearch.toLowerCase());
                        return !hiddenPantryItems.includes(item.id) && matchesSearch;
                      }).map(function(item) {
                        var isSelected = selectedBreakfast.includes(item.id);
                        return (
                          <div
                            key={item.id}
                            onClick={function() {
                              if (breakfastEditMode) return;
                              setViewingBreakfast(item);
                            }}
                            className={"p-4 rounded-xl border-2 cursor-pointer transition-all relative " + (breakfastEditMode ? "border-red-200 bg-red-50" : isSelected ? "border-green-400 bg-green-50" : "border-gray-200 bg-white hover:border-gray-300")}
                          >
                            {breakfastEditMode && (
                              <button
                                onClick={function(e) {
                                  e.stopPropagation();
                                  setHiddenPantryItems(function(prev) { return prev.concat([item.id]); });
                                  setSelectedBreakfast(function(prev) { return prev.filter(function(id) { return id !== item.id; }); });
                                }}
                                className="absolute -top-2 -right-2 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center shadow-md hover:bg-red-600 z-10"
                              >
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                              </button>
                            )}
                            <div className="flex items-start justify-between mb-2">
                              <div className="flex items-center gap-2">
                                <span className="text-2xl">{item.emoji || '🍳'}</span>
                                <h3 className="font-medium text-gray-900">{item.name}</h3>
                              </div>
                              {!breakfastEditMode && isSelected && (
                                <svg className="w-5 h-5 text-green-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" /></svg>
                              )}
                            </div>
                            <div className="text-sm text-gray-500 mb-3">
                              <span className="text-green-600 font-medium">{item.protein}g protein</span> • {item.calories} cal
                            </div>
                            <div className="flex flex-wrap gap-1">
                              {item.items.map(function(ing, i) {
                                return <span key={i} className="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">{ing}</span>;
                              })}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    {selectedBreakfast.length > 0 && !breakfastEditMode && (
                      <div className="p-4 bg-green-50 border border-green-200 rounded-xl">
                        <h3 className="font-medium text-green-800 mb-2">Selected Breakfasts ({selectedBreakfast.length})</h3>
                        <div className="flex flex-wrap gap-2">
                          {selectedBreakfast.map(function(id) {
                            var item = DEFAULT_BREAKFAST.find(function(b) { return b.id === id; });
                            if (!item) return null;
                            return (
                              <span key={id} className="inline-flex items-center gap-1 px-3 py-1.5 bg-green-100 rounded-full text-sm text-green-700">
                                {item.emoji || '🍳'} {item.name}
                              </span>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>
                ) : (
                  <React.Fragment>
                    {/* Recipes Grid */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                      {allRecipes.filter(function(recipe) {
                        var matchesCategory = categoryFilter === 'all' || recipe.category === categoryFilter;
                        var matchesSearch = !recipeSearch || recipe.name.toLowerCase().includes(recipeSearch.toLowerCase());
                        return matchesCategory && matchesSearch;
                      }).map(function(recipe) {
                        return (
                          <RecipeCard
                            key={recipe.id}
                            recipe={recipe}
                            isSelecting={selectedSlot !== null}
                            canGenerateImage={!!openaiApiKey}
                            onGenerateImage={function() {
                              generateRecipeImage(recipe.name, recipe.id, false, recipe);
                            }}
                            onSelect={function() {
                              setViewingRecipe(recipe);
                            }}
                            onEdit={function() {
                              openEditRecipe(recipe);
                            }}
                            onDelete={function() {
                              deleteRecipe(recipe.id);
                            }}
                            onQuickSelect={function() {
                              selectRecipe(recipe.id);
                            }}
                          />
                        );
                      })}
                    </div>

                    {allRecipes.filter(function(recipe) {
                      var matchesCategory = categoryFilter === 'all' || recipe.category === categoryFilter;
                      var matchesSearch = !recipeSearch || recipe.name.toLowerCase().includes(recipeSearch.toLowerCase());
                      return matchesCategory && matchesSearch;
                    }).length === 0 && (
                      <div className="text-center py-12 text-gray-500">
                        No recipes in this category. Try importing one!
                      </div>
                    )}
                  </React.Fragment>
                )}
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DataLoader />);
  </script>
</body>
</html>
